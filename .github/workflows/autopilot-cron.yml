name: 🕋 Auto-Pilot 24/7 Islamic Publisher (Every 6h)

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  publish-reel:
    name: 🎬 Generate & Publish Islamic Reel (Instagram & TikTok)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci || npm install

      - name: 🛠️ Install FFmpeg, Librsvg & Arabic Calligraphy Fonts
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq --fix-missing
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-hosny-amiri fonts-sil-scheherazade fonts-kacst fonts-noto-core fonts-noto-ui-core

      - name: 🚀 Execute Cloud Auto-Pilot Publication Cycle
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN || 'vXkaxUF8bX5anmrPe_4BMyXe6Lo36lwZYTAPYmCDHkM' }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID || '6a8f4ce9ccaf649a672154f6' }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID || '6a8f4dcfccaf649a672158cf' }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID || '6a999279065799be467f1f35' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'zmgzjmpl' }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET || 'ml_default' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || 'https://discord.com/api/webhooks/1542317690255839402/lJKv3K4988iwAhvc7Jpay8zvBhJ4aXB3dL6GMPGR8o4D9FauC3cuGoIcrOTfJBzAZkPU' }}
        run: node scripts/cloudAutoPilotRunner.cjs

      - name: 💾 Commit & Push Updated Deduplication Registry
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(autopilot): recorded publication in registry [skip ci]"
          file_pattern: "data/publishedRegistry.json"
